spring:
  application:
    name: museum

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/hml?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:Passwd12345678!}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1                # 基线版本号，默认1
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:9000}

museum:
  storage:
    endpoint: ${RUSTFS_ENDPOINT:http://127.0.0.1:19000}
    access-key: ${RUSTFS_ACCESS_KEY:rustfsadmin}
    secret-key: ${RUSTFS_SECRET_KEY:rustfsadmin}
    region: ${RUSTFS_REGION:us-east-1}
    bucket: ${RUSTFS_BUCKET:museum-images}
    presign-minutes: ${RUSTFS_PRESIGN_MINUTES:30}
    upload-expiry-minutes: ${RUSTFS_UPLOAD_EXPIRY_MINUTES:60}

  backup:
    mysql-backup-dir: ${MYSQL_BACKUP_DIR:./backup/mysql}
    mc-command: ${MC_COMMAND:mc}
    backup-rustfs-endpoint: ${BACKUP_RUSTFS_ENDPOINT:http://localhost:9100}
    backup-rustfs-bucket: ${BACKUP_RUSTFS_BUCKET:museum-images-backup}

  statistics:
    # 物理磁盘统计路径：填写应用实际部署环境中存在的目录。
    # 若 RustFS 在独立主机/容器，需在 RustFS 主机单独采集物理磁盘指标。
    storage-path: ${MUSEUM_STATISTICS_STORAGE_PATH:${user.dir}}
    rustfs-refresh-ms: ${MUSEUM_STATISTICS_RUSTFS_REFRESH_MS:3600000}

  auth:
    # 首次启动时必须设置 MUSEUM_SUPER_PASSWORD（至少12位）；后续启动不会重置现有超级用户密码。
    super-username: ${MUSEUM_SUPER_USERNAME:super}
    super-password: ${MUSEUM_SUPER_PASSWORD:}
    # 闲置锁屏默认15分钟；服务端会话租约用于识别浏览器崩溃/断电等异常退出。
    idle-timeout-seconds: ${MUSEUM_IDLE_TIMEOUT_SECONDS:900}
    session-lease-seconds: ${MUSEUM_SESSION_LEASE_SECONDS:120}
    heartbeat-interval-seconds: ${MUSEUM_HEARTBEAT_INTERVAL_SECONDS:30}
