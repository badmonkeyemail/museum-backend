<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>审批表</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "SimSun", "宋体", "Noto Serif CJK SC", "Source Han Serif SC", serif;
      background: #f5f5f5;
      color: #000;
      line-height: 1.5;
    }

    .page {
      width: 210mm;
      min-height: 297mm;
      margin: 20px auto;
      background: #fff;
      padding: 40px 50px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.12);
      position: relative;
    }

    /* ========== 第1页：审批表 ========== */
    .title {
      text-align: center;
      font-size: 28px;
      font-weight: bold;
      letter-spacing: 12px;
      margin-bottom: 36px;
      margin-top: 10px;
    }

    .form-table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
      border: 1.5px solid #000;
    }

    .form-table td {
      border: 1px solid #000;
      vertical-align: middle;
      padding: 0;
    }

    .label-cell {
      width: 110px;
      text-align: center;
      font-size: 15px;
      background: #fff;
      padding: 12px 8px;
      white-space: nowrap;
    }

    .value-cell {
      height: 42px;
      padding: 8px 12px;
    }

    /* 两倍高度 */
    .double-label {
      width: 110px;
      text-align: center;
      font-size: 15px;
      vertical-align: middle;
      padding: 12px 8px;
    }

    .double-value {
      height: 84px;
      padding: 12px;
      vertical-align: top;
    }


    /* 申请事由 大区域 */
    .reason-label {
      width: 110px;
      text-align: center;
      font-size: 15px;
      vertical-align: middle;
      padding: 12px 8px;
    }

    .reason-value {
      height: 220px;
      padding: 12px;
      vertical-align: top;
    }

    /* ========== 第2页：附件 ========== */
    .page-2 {
      padding-top: 50px;
    }

    .attachment-title {
      font-size: 16px;
      margin-bottom: 20px;
    }

    .dialog-screenshot {
      display: block;
      max-width: 320px;
      margin: 0 0 40px 20px;
      border: 1px solid #ddd;
      box-shadow: 0 1px 4px rgba(0,0,0,0.1);
    }

    .field-list {
      margin-top: 10px;
      margin-left: 10px;
    }

    .field-item {
      font-size: 15px;
      margin-bottom: 18px;
      line-height: 1.6;
    }

    .field-item .label {
      display: inline-block;
      min-width: 90px;
    }

    /* 打印优化 */
    @media print {
      body {
        background: #fff;
      }
      .page {
        margin: 0;
        box-shadow: none;
        page-break-after: always;
      }
      .page:last-child {
        page-break-after: auto;
      }
    }
  </style>
</head>

<body>

  <!-- ==================== 第 1 页 ==================== -->
  <div class="page">
    <h1 class="title">审 批 表</h1>

    <table class="form-table">
      <tr>
        <td class="label-cell">编号</td>
        <td class="value-cell" id="approval_no"></td>
      </tr>
      <tr>
        <td class="label-cell">申请时间</td>
        <td class="value-cell" id="approval_time"></td>
      </tr>
      <tr>
        <td class="double-label">申请人</td>
        <td class="double-value" id="applicant"></td>
      </tr>
      <tr>
        <td class="label-cell">申请用途</td>
        <td class="value-cell" id="purpose"></td>
      </tr>
      <tr>
        <td class="label-cell">审批数量</td>
        <td class="value-cell" id="artwork_sum"></td>
      </tr>
      <tr>
        <td class="reason-label">申请事由</td>
        <td class="reason-value" id="reason"></td>
      </tr>
      <tr>
        <td class="label-cell">归还时间</td>
        <td class="value-cell" id="back_time"></td>
      </tr>
      <tr>
        <td class="double-label">审批意见</td>
        <td class="double-value" id="result"></td>
      </tr>
      <tr>
        <td class="label-cell">审批时间</td>
        <td class="value-cell" id="completed_time"></td>
      </tr>
      <tr>
        <td class="double-label">审批人签章</td>
        <td class="double-value" id="approver"></td>
      </tr>
    </table>
  </div>
