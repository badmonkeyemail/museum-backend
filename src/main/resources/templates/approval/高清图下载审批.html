<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="downloadPages">
  <style>
    .download-page { page-break-after: always; }
    .download-page:last-child { page-break-after: auto; }
    .download-heading { font-size: 18px; font-weight: bold; margin-bottom: 24px; }
    .download-thumb { display: block; max-width: 440px; max-height: 420px; margin: 10px auto 34px; border: 1px solid #ddd; }
    .download-file { font-size: 16px; line-height: 1.8; margin: 24px 0; overflow-wrap: break-word; }
    .download-label { font-weight: bold; display: inline-block; min-width: 110px; }
  </style>
  <div class="page download-page" th:each="item, stat : ${downloadAttachments}">
    <div class="download-heading" th:text="'附件 ' + (stat.index + 1) + '：高清图下载文件'"></div>
    <img class="download-thumb" th:if="${item.imageDataUri != null}" th:src="${item.imageDataUri}" alt="高清图缩略图"/>
    <div class="download-file">
      <span class="download-label">文件名称：</span>
      <span th:text="${item.fileName}"></span>
    </div>
  </div>
</th:block>
</body>
</html>
