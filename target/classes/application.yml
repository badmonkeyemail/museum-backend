spring:
  application:
    name: museum

  mvc:
    throw-exception-if-no-handler-found: true

  web:
    resources:
      add-mappings: false   # 可选：避免把不存在的静态资源请求当成“有资源映射”而吞掉 404

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:13306/hml?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:mysql}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

#  flyway:
#    enabled: true
#    baseline-on-migrate: true
#    baseline-version: 1                # 基线版本号，默认1
#    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:9000}

museum:
  storage:
    endpoint: ${RUSTFS_ENDPOINT:http://127.0.0.1:19000}
    access-key: ${RUSTFS_ACCESS_KEY:rustfsadmin}
    secret-key: ${RUSTFS_SECRET_KEY:rustfsadmin}
    region: ${RUSTFS_REGION:us-east-1}
    bucket: ${RUSTFS_BUCKET:museum-images}
    presign-minutes: ${RUSTFS_PRESIGN_MINUTES:30}
    upload-expiry-minutes: ${RUSTFS_UPLOAD_EXPIRY_MINUTES:60}

  backup:
    mysql-backup-dir: ${MYSQL_BACKUP_DIR:./backup/mysql}
    mc-command: ${MC_COMMAND:mc}
    backup-rustfs-endpoint: ${BACKUP_RUSTFS_ENDPOINT:http://localhost:9100}
    backup-rustfs-bucket: ${BACKUP_RUSTFS_BUCKET:museum-images-backup}

  statistics:
    # 物理磁盘统计路径：填写应用实际部署环境中存在的目录。
    # 若 RustFS 在独立主机/容器，需在 RustFS 主机单独采集物理磁盘指标。
    storage-path: ${MUSEUM_STATISTICS_STORAGE_PATH:${user.dir}}
    rustfs-refresh-ms: ${MUSEUM_STATISTICS_RUSTFS_REFRESH_MS:3600000}

  auth:
#    session-lease-seconds: 120
#    idle-timeout-seconds: 900
#    heartbeat-interval-seconds: 30
    session-lease-seconds: 12000
    idle-timeout-seconds: 90000
    heartbeat-interval-seconds: 3000

  approval:
    download-token-hours: 12

  artwork-status:
    temporary-outbound-id: 7
    reproduction-loan-id: 8